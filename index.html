<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Madison Smith</title>
    <style>
      /* Registering the colors lets the browser fade smoothly between
         space and day values, instead of snapping. */
      @property --bg {
        syntax: "<color>";
        inherits: true;
        initial-value: #0b0c16;
      }
      @property --text {
        syntax: "<color>";
        inherits: true;
        initial-value: #f3efe8;
      }
      @property --muted {
        syntax: "<color>";
        inherits: true;
        initial-value: #a39d93;
      }
      @property --accent {
        syntax: "<color>";
        inherits: true;
        initial-value: #d98c7e;
      }
      @property --ring {
        syntax: "<color>";
        inherits: true;
        initial-value: #26242a;
      }

      /* Space mode (the default) */
      :root {
        --bg: #0b0c16;
        --text: #f3efe8;
        --muted: #a39d93;
        --accent: #d98c7e;
        --ring: #26242a;
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        --star: #ffffff;
        /* Going back to space: colors darken right away as the star recedes */
        transition-property: --bg, --text, --muted, --accent, --ring;
        transition-duration: 2s;
      }

      /* Day mode: added by the button */
      :root.day {
        --bg: #fdf3e1;
        --text: #1f1d1a;
        --muted: #6b665e;
        --accent: #e8a598;
        --ring: #ffffff;
        /* Wait for the star to get close, then brighten */
        transition-delay: 1.2s;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Star field sits behind everything, fills the window */
      .stars {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        transition: opacity 2s;
      }

      /* Sunlight washes out the background stars */
      .day .stars {
        opacity: 0;
      }

      /* The approaching star: a big glowing gradient, shrunk to a dot
         in the corner until day mode pulls it in close */
      .sun {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 160vmax;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #fffef5 0%,
          #fff3c4 7%,
          #ffd27a 14%,
          rgba(255, 170, 90, 0.45) 28%,
          rgba(255, 170, 90, 0) 60%
        );
        transform: translate(-50%, -50%) translate(38vw, -38vh) scale(0.015);
        pointer-events: none;
        z-index: 0;
        /* Leaving: drifts back out, slowing as it goes */
        transition: transform 2.5s ease-out;
      }

      .day .sun {
        transform: translate(-50%, -50%) translate(22vw, -28vh) scale(1);
        /* Arriving: starts slow, then rushes in */
        transition: transform 3s cubic-bezier(0.7, 0, 0.9, 0.5);
      }

      .mode-toggle {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 2;
        padding: 0.5rem 1.1rem;
        font: inherit;
        font-weight: 500;
        color: var(--text);
        background: var(--bg);
        border: 1.5px solid var(--text);
        border-radius: 999px;
        cursor: pointer;
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 75vh;
        display: grid;
        place-items: center;
      }

      .hero {
        background: var(--bg); /* opaque, so stars don't show through */
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid black;
        gap: 2.5rem;
        padding: 3rem 4rem;
      }

      .hero__text {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .hero__photo {
        width: 200px;
        aspect-ratio: 1;
        border-radius: 50%;
        object-fit: cover;
        object-position: center 10%;
        border: 6px solid var(--ring);
        box-shadow:
          var(--shadow),
          0 0 0 2px var(--accent);
        background: var(--accent);
      }

      .hero__name {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 4.5rem;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      .hero__tagline {
        margin: 0;
        max-width: 36ch;
        font-size: 1.25rem;
        line-height: 1.5;
        color: var(--muted);
      }

      .hero__links {
        display: flex;
        gap: 1.5rem;
        margin-top: 0.5rem;
      }

      .hero__links a {
        color: var(--text);
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 2px;
        text-underline-offset: 4px;
      }

      .hero__links a:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <canvas class="stars" aria-hidden="true"></canvas>
    <div class="sun" aria-hidden="true"></div>
    <button class="mode-toggle" type="button" aria-pressed="false">
      Day mode
    </button>
    <main>
      <section class="hero">
        <img
          class="hero__photo"
          src="madison.jpg"
          alt="Portrait of Madison Smith"
        />
        <div class="hero__text">
          <h1 class="hero__name">Madison Smith</h1>
          <p class="hero__tagline">
            Astrophysicist - Data Scientist - Not an artist
          </p>
          <nav class="hero__links">
            <a
              href="https://scholar.google.com/citations?user=BAizl1kAAAAJ&hl=en"
              target="_blank"
              rel="noopener"
              >Google Scholar</a
            >
            <a
              href="https://letterboxd.com/madisonsmith126/"
              target="_blank"
              rel="noopener"
              >Letterboxd</a
            >
          </nav>
        </div>
      </section>
    </main>

    <script>
      const canvas = document.querySelector(".stars");
      const ctx = canvas.getContext("2d");
      const starColor = getComputedStyle(document.documentElement)
        .getPropertyValue("--star")
        .trim();
      let stars = [];

      function makeStars() {
        // Match the canvas to the window, sharp on retina screens
        const dpr = window.devicePixelRatio || 1;
        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        //change here for more/less stars. lower number gives more stars (obviously)
        const count = Math.round((innerWidth * innerHeight) / 5000);
        stars = Array.from({ length: count }, () => {
          const r = 0.5 + Math.random() * 2; // radius: 0.5–2.5px
          return {
            x: Math.random() * innerWidth,
            y: Math.random() * innerHeight,
            r,
            speed: 12 / r, // bigger = slower (px per second)
            alpha: 0.3 + Math.random() * 0.5,
          };
        });
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.1); // seconds since last frame
        last = now;

        ctx.clearRect(0, 0, innerWidth, innerHeight);
        ctx.fillStyle = starColor;
        for (const s of stars) {
          s.x += s.speed * dt;
          // Drifted off the right edge: re-enter on the left at a new height
          if (s.x - s.r > innerWidth) {
            s.x = -s.r;
            s.y = Math.random() * innerHeight;
          }
          ctx.globalAlpha = s.alpha;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(frame);
      }

      makeStars();
      window.addEventListener("resize", makeStars);
      requestAnimationFrame(frame);

      // Day/space toggle: CSS does all the animating
      const toggle = document.querySelector(".mode-toggle");
      toggle.addEventListener("click", () => {
        const isDay = document.documentElement.classList.toggle("day");
        toggle.textContent = isDay ? "Space mode" : "Day mode";
        toggle.setAttribute("aria-pressed", isDay);
      });
    </script>
  </body>
</html>
