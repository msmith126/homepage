<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madison Smith</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf7f2;
      --text: #1f1d1a;
      --muted: #6b665e;
      --accent: #e8a598;
      --ring: #ffffff;
      --shadow: 0 12px 32px rgba(31, 29, 26, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17161a;
        --text: #f3efe8;
        --muted: #a39d93;
        --accent: #d98c7e;
        --ring: #26242a;
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1rem;
      text-align: center;
    }

    .hero__photo {
      width: clamp(140px, 30vw, 200px);
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid var(--ring);
      box-shadow: var(--shadow), 0 0 0 2px var(--accent);
      background: var(--accent);
    }

    .hero__name {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .hero__tagline {
      margin: 0;
      max-width: 36ch;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      line-height: 1.5;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <!-- Swap src for your real photo, e.g. src="images/madison.jpg" -->
      <img
        class="hero__photo"
        src="https://placehold.co/400x400/e8a598/ffffff?text=MS&font=playfair-display"
        alt="Portrait of Madison Smith"
      >
      <h1 class="hero__name">Madison Smith</h1>
      <p class="hero__tagline">Your tagline goes here — a short line about what you do.</p>
    </section>
  </main>
</body>
</html>
